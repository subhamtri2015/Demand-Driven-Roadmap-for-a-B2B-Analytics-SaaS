<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 480" role="img" aria-labelledby="title desc">
<title id="title">RICE scores with sensitivity cases</title><desc id="desc">Ranks public issue reach proxies multiplied by assumed impact, confidence, and effort; text shows two changed-assumption scenarios.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif;fill:#1d2b34}.small{font-size:13px}.body{font-size:15px}.heading{font-size:19px;font-weight:700}.tag{font-size:12px;font-weight:700}</style>
<text x="26" y="42" class="heading">RICE score and assumption sensitivity</text><text x="26" y="67" class="small">Base scores from processed reach; impact, confidence, effort are assumptions.</text><text x="26" y="130" class="body">A  SDK theming with CSS variables</text><line x1="390" y1="124" x2="620.4" y2="124" stroke="#167d78" stroke-width="14" stroke-linecap="square"/><line x1="543.6" y1="137" x2="620.4" y2="137" stroke="#c45c35" stroke-width="5"/><text x="543.6" y="159" class="small">effort 3</text><text x="630.4" y="130" class="body">28.80</text><text x="26" y="194" class="body">B  Warehouse connector gaps</text><line x1="390" y1="188" x2="599.0663999999999" y2="188" stroke="#478f8b" stroke-width="14" stroke-linecap="square"/><text x="609.0663999999999" y="194" class="body">26.13</text><text x="26" y="258" class="body">C  Granular permissions</text><line x1="390" y1="252" x2="579.6" y2="252" stroke="#79a9a4" stroke-width="14" stroke-linecap="square"/><line x1="579.6" y1="265" x2="655.4399999999999" y2="265" stroke="#c45c35" stroke-width="5"/><text x="655.4399999999999" y="287" class="small">confidence 70%</text><text x="589.6" y="258" class="body">23.70</text><text x="26" y="322" class="body">D  Dashboard filters</text><line x1="390" y1="316" x2="534.0" y2="316" stroke="#c79845" stroke-width="14" stroke-linecap="square"/><text x="544.0" y="322" class="body">18.00</text><text x="26" y="386" class="body">E  Remote sync branches</text><line x1="390" y1="380" x2="486.0" y2="380" stroke="#a8b4ba" stroke-width="14" stroke-linecap="square"/><text x="496.0" y="386" class="body">12.00</text><text x="26" y="445" class="small">A effort 3: 19.20 | C confidence 70%: 33.18</text><rect x="800" y="25" width="170" height="26" rx="3" fill="#f5e3bd"/><text x="815" y="43" class="tag">Assumptions</text></svg>